<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>مركز أحلى الأسعار - الجبايش</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* [نفس التنسيقات السابقة، بدون تعديل] */
    :root {
      --main-color: #d50032;
      --accent-color: #fffaf0;
      --gold: #d4af37;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
      --card-bg: rgba(255, 255, 255, 0.1);
      --backdrop-blur: blur(10px);
      --text-color-dark: #333;
      --text-color-light: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(to right, #1e1e2f, #2d2d44);
      color: var(--text-color-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }
    .container {
      background: var(--card-bg);
      backdrop-filter: var(--backdrop-blur);
      -webkit-backdrop-filter: var(--backdrop-blur);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 30px 24px;
      width: 100%;
      max-width: 400px;
      animation: fadeIn 0.6s ease;
      color: var(--text-color-light);
      text-align: center;
    }
    h2 {
      font-size: 26px;
      margin-bottom: 25px;
      font-weight: 700;
      color: var(--gold);
      text-shadow: 0 0 8px rgba(212, 175, 55, 0.8);
    }
    input, button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      margin-bottom: 16px;
      border-radius: 15px;
      border: none;
      font-weight: 600;
      transition: all 0.3s ease;
      text-align: center;
      font-family: 'Tajawal', sans-serif;
    }
    input {
      background-color: rgba(255, 255, 255, 0.15);
      border: 2px solid var(--main-color);
      color: var(--text-color-light);
      caret-color: var(--gold);
    }
    input::placeholder { color: rgba(255, 255, 255, 0.7); font-weight: 400; }
    input:focus {
      outline: none;
      border-color: var(--gold);
      background-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 8px var(--gold);
    }
    button {
      background: linear-gradient(90deg, #ff512f, #dd2476);
      color: white;
      cursor: pointer;
      box-shadow: 0 0 10px #dd2476;
      font-size: 18px;
      font-weight: 700;
    }
    button:hover:not(:disabled) {
      background: linear-gradient(90deg, #dd2476, #ff512f);
      box-shadow: 0 0 15px #ff512f;
      transform: scale(1.05);
    }
    button:disabled {
      background-color: #555;
      cursor: not-allowed;
      color: #999;
      box-shadow: none;
    }
    .error {
      color: #ff7070;
      font-size: 15px;
      min-height: 24px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .notice {
      background: rgba(255, 74, 74, 0.2);
      padding: 15px 20px;
      font-size: 14px;
      border-right: 6px solid var(--main-color);
      margin-top: 12px;
      border-radius: 12px;
      line-height: 1.6;
      color: #fff4f4;
      font-weight: 600;
    }
    .profile .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
      gap: 16px;
    }
    .user-info { flex: 1; text-align: right; }
    #userName {
      font-size: 20px;
      font-weight: 900;
      margin: 0;
      padding: 8px 16px;
      color: var(--gold);
      background-color: var(--accent-color);
      border: 2px solid var(--gold);
      border-radius: 15px;
      display: inline-block;
      box-shadow: 0 0 8px var(--gold);
    }
    #userPhone { font-size: 14px; margin-top: 6px; color: #bbb; }
    #userImage {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--main-color);
      box-shadow: 0 0 15px var(--main-color);
    }
    .welcome-text {
      font-size: 18px;
      font-weight: 700;
      margin: 25px 0;
    }
    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .menu-buttons button {
      background-color: rgba(255, 255, 255, 0.15);
      color: var(--text-color-light);
      border: 2px solid rgba(255, 255, 255, 0.3);
      font-weight: 700;
      font-size: 18px;
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      transition: all 0.3s ease;
      cursor: pointer;
      gap: 10px;
    }
    .menu-buttons button:hover {
      background-color: var(--main-color);
      color: white;
      box-shadow: 0 0 15px var(--main-color);
      transform: scale(1.05);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div class="container" id="loginBox">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="codeInput" placeholder="رمز الدخول" autocomplete="off" />
    <button onclick="login()">دخول</button>
    <p class="error" id="errorMsg"></p>
    <div class="notice">
      ⚠️ عزيزي الزبون،<br>
      بسبب سياسة الشركات وشكاوي أصحاب المحلات
      اضطررنا إلى أن نجعل لكل زبون رمز دخول خاص به.
    </div>
  </div>

  <!-- شاشة الملف الشخصي -->
  <div class="container profile" id="profileBox" style="display: none;">
    <div class="user-bar">
      <div class="user-info">
        <h3 id="userName">اسم المستخدم</h3>
        <p id="userPhone">رقم الهاتف</p>
      </div>
      <img id="userImage" src="" alt="صورة المستخدم" />
    </div>
    <div class="welcome-text">أهلاً بك زبون مركز أحلى الأسعار - الجبايش</div>
    <div class="menu-buttons">
      <button onclick="window.location.href='asiacell.html'">📱 عروض آسيا سيل</button>
      <button onclick="window.location.href='kfo.html'">📶 عروض زين كفو</button>
      <button>💙 عـروض أودي</button>
      <button onclick="openCalculator()">🧮 حاسبة الكوينـات</button>
      <button onclick="openContact()">📞 تواصــل معنــا</button>
      <button onclick="openWebsite()">📍 موقــع المحــل</button>
      <button onclick="logout()">🚪 تسجيل الخروج</button>
    </div>
  </div>

  <script>
    let usersData = [];

    // تحميل بيانات المستخدمين
    fetch('users.json')
      .then(response => {
        if (!response.ok) throw new Error('فشل تحميل بيانات المستخدمين');
        return response.json();
      })
      .then(data => {
        usersData = data;
        checkLoginStatus(); // ✅ افحص حالة الدخول بعد تحميل البيانات
      })
      .catch(error => {
        console.error('خطأ:', error);
      });

    function login() {
      const code = document.getElementById("codeInput").value.trim();
      const error = document.getElementById("errorMsg");

      if (!code) {
        error.textContent = "يرجى إدخال رمز الدخول.";
        return;
      }

      const user = usersData.find(u => u.code === code);
      if (user) {
        error.textContent = "";
        localStorage.setItem("loggedInUser", JSON.stringify(user)); // ✅ حفظ المستخدم
        showUserProfile(user);
      } else {
        error.textContent = "رمز الدخول غير صحيح.";
      }
    }

    function showUserProfile(user) {
      document.getElementById("userName").textContent = user.name;
      document.getElementById("userPhone").textContent = user.phone;
      document.getElementById("userImage").src = "images/" + user.image;
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("profileBox").style.display = "block";
    }

    function checkLoginStatus() {
      const storedUser = localStorage.getItem("loggedInUser");
      if (storedUser) {
        try {
          const user = JSON.parse(storedUser);
          showUserProfile(user);
        } catch (e) {
          console.error("فشل قراءة بيانات المستخدم:", e);
          localStorage.removeItem("loggedInUser");
        }
      }
    }

    function logout() {
      localStorage.removeItem("loggedInUser");
      location.reload(); // إعادة تحميل الصفحة
    }

    function openCalculator() {
      window.open("https://ali99hassan-99.github.io/55/", "_blank");
    }

    function openWebsite() {
      window.location.href = "address.html";
    }

    function openContact() {
      alert("سيتم تطوير هذه الخاصية لاحقًا.");
    }
  </script>

</body>
</html>
