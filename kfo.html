<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>عروض خط كفوو</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- استدعاء الخط العصري -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Noto Kufi Arabic', sans-serif;
      background: linear-gradient(to right, #e383a8, #fcea68);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      color: #ffffff;
      text-shadow: 1px 1px 3px #00000055;
      font-size: 30px;
      margin-bottom: 20px;
    }

    img {
      max-width: 80%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .back-button {
      margin-top: 30px;
      padding: 10px 20px;
      background-color: #ffffffaa;
      border: none;
      border-radius: 8px;
      color: #333;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
      text-decoration: none;
    }

    .back-button:hover {
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  <h1>ستتوفر عروض خط كفوو هنا قريبا</h1>
  <img src="kfo.png" alt="صورة كفوو" />
  <a href="index.html" class="back-button">العودة إلى القائمة الرئيسية</a>
</body>
</html>
